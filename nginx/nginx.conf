# Load balancer in front of the stateless API nodes.
worker_processes auto;
events { worker_connections 1024; }

http {
    upstream api_cluster {
        least_conn;                                   # send each request to the least busy node
        server api1:8000 max_fails=2 fail_timeout=10s; # passive health check: skip a node that fails twice
        server api2:8000 max_fails=2 fail_timeout=10s;
        server api3:8000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;
        client_max_body_size 300m;                    # must be >= MAX_UPLOAD_BYTES of the API nodes

        location /api/ {
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            proxy_next_upstream error timeout http_502 http_503;  # retry idempotent requests on another node
            proxy_connect_timeout 3s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;                       # stream downloads straight through
        }
    }
}
